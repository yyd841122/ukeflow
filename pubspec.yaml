name: ukeflow
description: "UkeFlow — 纯自用尤克里里弹唱学习 App。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  chord_pro: ^0.8.0
  flutter_soloud: ^4.1.7
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
  drift_dev: ^2.35.1
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/chords/ukulele.json
    - assets/charts/
