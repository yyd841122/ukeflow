name: ukeflow
description: "UkeFlow — 纯自用尤克里里弹唱学习 App。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  chord_pro: ^0.8.0
  flutter_soloud: ^4.1.7
  webview_flutter: ^4.14.1
  # 调音链路(工单 19,spike A 迁入):record 采集 PCM16/44.1kHz/单声道,
  # pitch_detector_dart 做 YIN 音高检测(2048 窗)。版本与 spike 对齐。
  record: ^7.1.1
  pitch_detector_dart: ^0.0.7
  photo_view: ^0.15.0
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
  drift_dev: ^2.35.1
  build_runner: ^2.15.1
  # 测试打桩 image_picker 用(平台接口缝,ImagePickerPlatform.instance);
  # 仅测试引用,不进生产依赖。版本随 image_picker 传递约束。
  image_picker_platform_interface: ^2.11.2

flutter:
  uses-material-design: true
  assets:
    - assets/chords/ukulele.json
    - assets/charts/
    - assets/image_charts/
